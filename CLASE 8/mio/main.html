<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header><h1>Simulador de perfil de Usuario</h1></header>
    <div class="enlaces"> 
        <a href="https://github.com" target="_blank">Repositorio Clase</a> | 
        <a href="https://www.w3schools.com" target="_blank">Documentación w3schools</a>
    </div>
    <div class="container">
        <div class="form-div">
            <h2>Datos del usuario</h2>
            <form action="form-perfil">
                <div class="inputs">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Ej: pepe gavilan" required>
                </div>
               
                <div class="inputs">
                    <label for="profesion">Profesion:</label>
                    <input type="text" id="profesion" placeholder="Ej: profesor" required>
                </div>

                <div class="inputs">
                    <label for="url-imagen">URL de la imagen</label>
                    <input type="url" id="url-imagen" placeholder="Ej: https://.../me1.png" required>
                </div>

                <div class="inputs">
                        <label for="color-fondo">Color de Fondo:</label>
                        <select id="color-fondo">
                        <option value="">Selecciona un color</option>
                        <option value="red">Rojo</option>
                        <option value="blue">Azul</option>
                        <option value="yellow">Amarillo</option>
                        <option value="brown">Marrón</option>
                        <option value="green">Verde</option>
                        </select>
                </div>

                <button type="button" id="boton-generar">Generar Perfil</button>
            </form>
        </div>

        <div class="div-perfil">
            <h2>Vista Previa</h2>
            <div id="perfil-fondo" class="fondo-perfil">
                
                <div class="imagen-container">
                    <img id="perfil-imagen" src="placeholder.png" alt="Imagen de perfil">
                </div>

                <div class="texto-container">
                    <h3 id="perfil-nombre">Nombre de Usuario</h3>
                    <p id="perfil-profesion">Tu Profesión</p>
                </div>

            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
