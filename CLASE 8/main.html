<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Perfil Dinámico</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Sección de Enlaces Superiores -->
    <header>
        <div class="links-superiores">
            <a href="https://github.com/tu-repositorio" target="_blank">Repositorio Clase</a> | 
            <a href="https://www.w3schools.com" target="_blank">Documentación w3schools</a>
        </div>
    </header>

    <h1>Simulador de Perfil de Usuario</h1>

    <!-- Contenedor Principal (Flexbox) -->
    <main class="main-container">

        <!-- LADO IZQUIERDO: Formulario de Datos -->
        <section class="seccion-datos card">
            <h2>Datos del Usuario</h2>
            <form id="form-perfil">
                <div class="input-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Ej: Osvaldo CANTONE" required>
                </div>

                <div class="input-group">
                    <label for="profesion">Profesión:</label>
                    <input type="text" id="profesion" placeholder="Ej: Profesor Porgy III" required>
                </div>

                <div class="input-group">
                    <label for="url-imagen">URL de Imagen:</label>
                    <input type="url" id="url-imagen" placeholder="Ej: https://.../me1.png" required>
                </div>

                <div class="input-group">
                    <label for="color-fondo">Color de Fondo:</label>
                    <!-- Usamos un input tipo color para la paleta nativa -->
                    <input type="color" id="color-fondo" value="#e6f4ea"> 
                </div>

                <button type="button" id="btn-generar">Generar Perfil</button>
            </form>
        </section>

        <!-- LADO DERECHO: Vista Previa del Perfil -->
        <section class="seccion-vista-previa card">
            <h2>Vista Previa</h2>
            <!-- Este es el contenedor que cambiará de color de fondo -->
            <div id="perfil-contenedor" class="perfil-display" style="background-color: #e6f4ea;">
                
                <div class="imagen-container">
                    <!-- Imagen circular por defecto o con la URL cargada -->
                    <img id="perfil-imagen" src="placeholder.png" alt="Imagen de perfil">
                </div>

                <div class="texto-container">
                    <h3 id="perfil-nombre">Nombre de Usuario</h3>
                    <p id="perfil-profesion">Tu Profesión</p>
                </div>

            </div>
        </section>

    </main>

    <!-- Vinculamos el JS al final -->
    <script src="script.js"></script>
</body>
</html>
