<!DOCTYPE html>

<head></head>

<body>
    <p id="p1"></p>
    <script>
        const opcionesMenu = ['Inicio', 'Productos', 'Servicios', 'Contacto']; // Transforma cada string en un string formateado como <li>
        const itemsHTML = opcionesMenu.map(opcion => `  <li>${opcion}</li>`);        // Unimos el arreglo generado en un solo string
        const menuHTML = `<ul class="nav-menu">\n${itemsHTML.join('\n')}\n</ul>`;
        document.getElementById("p1").innerHTML =menuHTML;
    </script>
</body>
</html>
