<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contratación de Planes</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>

    <div class="container">
        <form id="formulario-plan">
            <h2>Solicitud de Plan</h2>
            
            <div class="grupo-campo">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required>
            </div>

            <div class="grupo-campo">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" required>
            </div>

            <div class="grupo-campo">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" required>
            </div>

            <div class="grupo-campo">
                <label for="plan">Seleccioná tu Plan:</label>
                <select id="plan" required>
                    <option value="" disabled selected>Elegí una opción...</option>
                    <option value="Basic">Plan Basic</option>
                    <option value="Premium">Plan Premium</option>
                    <option value="Plus">Plan Plus Ultra</option>
                </select>
            </div>

            <div class="grupo-checkbox">
                <input type="checkbox" id="condiciones" required>
                <label for="condiciones">Acepto las condiciones de uso</label>
            </div>

            <button type="submit" id="btn-enviar">Enviar Solicitud</button>
        </form>

        <div id="card-confirmacion" class="card oculto">
            <h2>¡Suscripción Exitosa!</h2>
            <hr>
            <p><strong>Cliente:</strong> <span id="res-cliente"></span></p>
            <p><strong>Email:</strong> <span id="res-email"></span></p>
            <p><strong>Plan Contratado:</strong> <span id="res-plan" class="badge"></span></p>
            <div class="icono-check">✓</div>
        </div>
    </div>

</body>
</html>
